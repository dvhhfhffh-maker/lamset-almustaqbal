name: Build Tahaddi Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'party-challenge-android/**'
      - '.github/workflows/build-tahaddi-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: party-challenge-android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp party-challenge-android/app/build/outputs/apk/debug/app-debug.apk release/Tahaddi-AlAshab-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahaddi-AlAshab-Android
          path: release/Tahaddi-AlAshab-Android.apk
          if-no-files-found: error
          retention-days: 30
