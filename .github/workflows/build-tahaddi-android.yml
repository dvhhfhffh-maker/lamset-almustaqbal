name: Build Tahaddi Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'party-challenge-android/**'
      - '.github/workflows/build-tahaddi-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: party-challenge-android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp party-challenge-android/app/build/outputs/apk/debug/app-debug.apk release/Tahaddi-AlAshab-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahaddi-AlAshab-Android
          path: release/Tahaddi-AlAshab-Android.apk
          if-no-files-found: error
          retention-days: 30
