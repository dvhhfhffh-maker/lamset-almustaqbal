name: Sitemap encoding diagnostic
on:
  push:
    branches: [diagnostics/sitemap-encoding-20261005]
permissions:
  contents: read
jobs:
  encoding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Inspect raw gzip and identity sitemap responses
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import https from 'node:https';
          import { gunzipSync, inflateSync, brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const ORIGIN='https://lamset-almustaqbal-production.up.railway.app',TARGET=ORIGIN+'/sitemap.xml';
          const UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)';
          const xmlProbe="import sys,json,xml.etree.ElementTree as ET\ntry:\n    root=ET.fromstring(sys.stdin.read())\n    namespace=root.tag[1:].split(\"}\")[0] if root.tag.startswith(\"{\") else \"\"\n    locs=[(n.text or \"\").strip() for n in root.iter() if n.tag.split(\"}\")[-1]==\"loc\"]\n    print(json.dumps({\"xmlParsed\":True,\"root\":root.tag.split(\"}\")[-1],\"namespace\":namespace,\"locCount\":len(locs),\"uniqueLocCount\":len(set(locs))}))\nexcept ET.ParseError as error: print(json.dumps({\"xmlParsed\":False,\"xmlParseError\":str(error)}))";
          const safeHeaders=headers=>Object.fromEntries(['content-type','content-encoding','content-length','etag','last-modified','cache-control','vary','date','x-railway-request-id'].map(name=>[name,headers[name]]).filter(([,value])=>value!==undefined));
          const allowed=value=>{const u=new URL(value);return u.origin===ORIGIN&&u.pathname==='/sitemap.xml'&&!u.search&&!u.hash&&!u.username&&!u.password;};
          function rawRequest(url,method,encoding,etag) {
            if(!['GET','HEAD'].includes(method)||!allowed(url))throw new Error('Unsafe request target or method');
            return new Promise((resolve,reject)=>{
              const headers={'User-Agent':UA,'Accept':'application/xml,text/xml,*/*','Accept-Encoding':encoding};if(etag)headers['If-None-Match']=etag;
              const req=https.request(url,{method,headers},res=>{
                const chunks=[];let bytes=0;
                res.on('data',chunk=>{bytes+=chunk.length;if(bytes>1024*1024){res.destroy(new Error('Response exceeds 1 MiB limit'));return;}chunks.push(chunk);});
                res.on('end',()=>resolve({url,status:res.statusCode,headers:res.headers,wire:Buffer.concat(chunks),tls:res.socket?.getProtocol?.()}));
                res.on('error',reject);
              });
              req.setTimeout(25000,()=>req.destroy(new Error('HTTPS request timed out')));req.on('error',reject);req.end();
            });
          }
          async function fetchRaw(method,encoding,etag) {
            let url=TARGET;const chain=[];
            for(let hop=0;hop<5;hop++) {
              const result=await rawRequest(url,method,encoding,etag);
              const entry={url,status:result.status,headers:safeHeaders(result.headers)};chain.push(entry);
              if([301,302,303,307,308].includes(result.status)) {
                if(!result.headers.location)throw new Error('Redirect missing Location');url=new URL(result.headers.location,url).href;entry.location=url;
                if(!allowed(url))throw new Error('Redirect leaves allowed HTTPS sitemap path');continue;
              }
              return {...result,chain};
            }
            throw new Error('Redirect limit exceeded');
          }
          function summarize(label,method,requestedEncoding,response) {
            const headerEncoding=String(response.headers['content-encoding']||'identity').toLowerCase();
            const row={label,method,requestedEncoding,requestedUrl:TARGET,status:response.status,chain:response.chain,finalUrl:response.url,wireBytes:response.wire.length,wirePrefixHex:response.wire.subarray(0,2).toString('hex'),contentEncoding:headerEncoding,tls:response.tls};
            if(method==='GET'&&response.status===200) {
              let decoded=response.wire;
              try {
                if(headerEncoding==='gzip')decoded=gunzipSync(response.wire);
                else if(headerEncoding==='deflate')decoded=inflateSync(response.wire);
                else if(headerEncoding==='br')decoded=brotliDecompressSync(response.wire);
                else if(headerEncoding!=='identity')throw new Error('Unsupported Content-Encoding '+headerEncoding);
                row.decodedBytes=decoded.length;row.decodedSha256=createHash('sha256').update(decoded).digest('hex');
                row.gzipProof=headerEncoding==='gzip'?{magicMatches:row.wirePrefixHex==='1f8b',gunzipSucceeded:true}:undefined;
                const result=spawnSync('python3',['-c',xmlProbe],{input:decoded.toString('utf8'),encoding:'utf8',timeout:10000,maxBuffer:12000});
                try{row.xml=JSON.parse(result.stdout);}catch{row.xml={xmlParsed:false,parserError:result.error?.message||'XML parser produced no JSON'};}
                const declared=response.headers['content-length'];if(declared!==undefined)row.wireMatchesContentLength=Number(declared)===response.wire.length;
              }catch(error){row.decodeError=error.message;}
            }
            return row;
          }
          const rows=[],responses={};
          for(const encoding of ['gzip','identity']) {
            try {const response=await fetchRaw('GET',encoding);responses[encoding]=response;const row=summarize('GET '+encoding,'GET',encoding,response);rows.push(row);console.log('ENCODING_DIAGNOSTIC='+JSON.stringify(row));}
            catch(error){const row={label:'GET '+encoding,error:error.message,cause:error.cause?.code};rows.push(row);console.log('ENCODING_DIAGNOSTIC='+JSON.stringify(row));}
          }
          try {const response=await fetchRaw('HEAD','gzip');const row=summarize('HEAD gzip','HEAD','gzip',response);rows.push(row);console.log('ENCODING_DIAGNOSTIC='+JSON.stringify(row));}
          catch(error){const row={label:'HEAD gzip',error:error.message};rows.push(row);console.log('ENCODING_DIAGNOSTIC='+JSON.stringify(row));}
          const etag=responses.identity?.headers.etag||responses.gzip?.headers.etag;
          if(typeof etag==='string'&&etag) {
            try {const response=await fetchRaw('GET','identity',etag);const row=summarize('GET If-None-Match','GET','identity',response);row.ifNoneMatch=etag;row.observed304=response.status===304;rows.push(row);console.log('ENCODING_DIAGNOSTIC='+JSON.stringify(row));}
            catch(error){const row={label:'GET If-None-Match',error:error.message};rows.push(row);console.log('ENCODING_DIAGNOSTIC='+JSON.stringify(row));}
          } else console.log('ENCODING_DIAGNOSTIC_CONDITIONAL='+JSON.stringify({skipped:true,reason:'No actual ETag returned by either GET'}));
          const gzip=rows.find(r=>r.label==='GET gzip'),identity=rows.find(r=>r.label==='GET identity');
          console.log('ENCODING_DIAGNOSTIC_SUMMARY='+JSON.stringify({requestSequences:rows.length,sameDecodedXML:!!gzip?.decodedSha256&&gzip.decodedSha256===identity?.decodedSha256,gzipRawVerified:gzip?.gzipProof?.magicMatches===true&&gzip?.gzipProof?.gunzipSucceeded===true,bothXMLParsed:gzip?.xml?.xmlParsed===true&&identity?.xml?.xmlParsed===true,limitation:'Googlebot User-Agent is supplied by this diagnostic runner; actual Google crawler IP access is not tested.'}));
          process.exitCode=rows.some(r=>r.error||r.decodeError||(r.method==='GET'&&r.status===200&&!r.xml?.xmlParsed))?1:0;
          NODE
