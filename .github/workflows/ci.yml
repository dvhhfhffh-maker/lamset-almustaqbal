name: Website checks
on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export resolved dependency manifest
        run: node -e "console.log('LOCKFILE_JSON=' + JSON.stringify(require('node:fs').readFileSync('package-lock.json','utf8')))"
      - name: Check source and templates
        run: npm run check
      - name: Verify routes, persistence and security
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Check desktop, phone and tablet interactions
        run: npm run test:e2e
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload generated dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          retention-days: 7
