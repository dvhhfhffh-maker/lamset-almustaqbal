name: Production smoke checks
on:
  push:
    branches: ["build/production-smoke"]
permissions:
  contents: read
concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BASE_URL: "https://lamset-almustaqbal-production.up.railway.app"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Wait for public health readiness
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.PLAYWRIGHT_BASE_URL;
          let ready=false;
          for(let attempt=1;attempt<=60;attempt++){
            try {
              const response=await fetch(base+'/healthz',{signal:AbortSignal.timeout(10000),redirect:'manual'});
              if(response.status===200&&(await response.json()).status==='ok'){ready=true;break;}
            } catch {}
            if(attempt<60)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          assert(ready,'Production /healthz must return HTTP 200 with status ok');
          console.log('READY: production healthcheck HTTP 200');
          NODE
      - name: Verify public pages and reject malformed review bodies
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.PLAYWRIGHT_BASE_URL.replace(/\/$/,'');
          let requests=0;
          let reviewSession;
          async function get(path){
            const response=await fetch(base+path,{method:'GET',redirect:'manual',signal:AbortSignal.timeout(20000)});
            requests++;
            return response;
          }
          function attribute(tag,name){return tag.match(new RegExp('\\b'+name+'=["\\x27]([^"\\x27]*)["\\x27]','i'))?.[1];}
          function canonical(html){const tag=[...html.matchAll(/<link\b[^>]*>/gi)].map(x=>x[0]).find(x=>attribute(x,'rel')==='canonical');return tag?attribute(tag,'href'):undefined;}
          function schemas(html){return [...html.matchAll(/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)].flatMap(x=>{const value=JSON.parse(x[1]);return value['@graph']||(Array.isArray(value)?value:[value]);});}
          function hasAttribute(tag,name){return new RegExp('\\s'+name+'(?:\\s|=|/?>)','i').test(tag);}
          function reviewForm(html){
            const form=[...html.matchAll(/<form\b[^>]*>[\s\S]*?<\/form>/gi)].map(x=>x[0]).find(x=>attribute(x.match(/^<form\b[^>]*>/i)?.[0]||'','id')==='customer-review-form');
            assert(form,'Customer review form must be present');
            const formTag=form.match(/^<form\b[^>]*>/i)[0];
            assert(attribute(formTag,'action')==='/testimonials','Review form submits to the native testimonials route');
            assert(attribute(formTag,'method')?.toLowerCase()==='post','Review form uses native POST');
            const controls=[...form.matchAll(/<(?:input|select|textarea|button)\b[^>]*>/gi)].map(x=>x[0]);
            const fields=new Map(controls.map(tag=>[attribute(tag,'name'),tag]));
            for(const name of ['_csrf','name','rating','service','district','comment','consent'])assert(fields.has(name),'Review form field: '+name);
            assert(attribute(fields.get('_csrf'),'type')==='hidden','Review CSRF token must be hidden');
            assert(/<textarea\b/i.test(fields.get('comment'))&&hasAttribute(fields.get('comment'),'required')&&attribute(fields.get('comment'),'minlength')==='3'&&attribute(fields.get('comment'),'maxlength')==='2000','Review comment enforces 3 to 2000 characters');
            assert(attribute(fields.get('consent'),'type')==='checkbox'&&hasAttribute(fields.get('consent'),'required'),'Publishing consent is a required checkbox');
            assert(controls.some(tag=>/^<button\b/i.test(tag)&&attribute(tag,'type')==='submit'),'Native review submit button must be present');
            return fields;
          }
          const pages=['/','/services','/services/interior-painting-riyadh','/projects','/before-after','/about','/testimonials','/blog','/quote','/contact','/riyadh/al-narjis'];
          const assets=new Set();
          for(const path of pages){
            const response=await get(path);
            assert(response.status===200,'Public page must be HTTP 200: '+path);
            assert((response.headers.get('content-type')||'').includes('text/html'),'HTML content type: '+path);
            const html=await response.text();
            assert(/<html\b[^>]*\blang=["']ar["']/i.test(html),'Arabic document language: '+path);
            assert(/<html\b[^>]*\bdir=["']rtl["']/i.test(html),'RTL document direction: '+path);
            assert([...html.matchAll(/<h1\b/gi)].length===1,'Exactly one H1: '+path);
            assert(canonical(html)===base+(path==='/'?'':path),'HTTPS canonical must use the public production domain: '+path);
            const business=schemas(html).find(x=>(Array.isArray(x['@type'])?x['@type']:[x['@type']]).includes('LocalBusiness'));
            assert(business?.['@id']===base+'/#business','Business schema must identify production origin: '+path);
            assert(/href=["']tel:\+966501308295["']/i.test(html),'Direct call link: '+path);
            assert(/https:\/\/wa\.me\/966501308295\?text=/.test(html),'WhatsApp contact link: '+path);
            const csp=response.headers.get('content-security-policy')||'';
            assert(csp.includes('script-src')&&!/script-src[^;]*'unsafe-inline'/.test(csp),'Protected script policy: '+path);
            if(path==='/testimonials'){
              const fields=reviewForm(html);
              const csrf=attribute(fields.get('_csrf'),'value');
              assert(/^[a-f0-9]{64}$/.test(csrf||''),'Review CSRF token must be valid');
              const sessionCookie=response.headers.getSetCookie().find(x=>/^lm\.sid=/.test(x));
              assert(sessionCookie&&/;\s*HttpOnly/i.test(sessionCookie)&&/;\s*Secure/i.test(sessionCookie)&&/;\s*SameSite=Lax/i.test(sessionCookie),'Review session requires a secure production cookie');
              reviewSession={csrf,cookie:sessionCookie.split(';',1)[0]};
              console.log('REVIEW_FORM_PASSED: native POST, seven fields, comment limits and mandatory publishing consent');
            }
            if(path==='/'){
              assert([...html.matchAll(/<a\b[^>]*>/gi)].some(x=>attribute(x[0],'href')==='/testimonials#write-review'),'Homepage provides the write-review CTA');
              for(const match of html.matchAll(/<(?:script|link)\b[^>]*>/gi)){
                const tag=match[0];
                const src=attribute(tag,'src')||(attribute(tag,'rel')==='stylesheet'?attribute(tag,'href'):undefined);
                if(src){const url=new URL(src,base);if(url.origin===base)assets.add(url.pathname+url.search);}
              }
            }
            console.log('PAGE 200 '+path);
          }
          assert(assets.size>=2,'The page must expose its local stylesheet and JavaScript');
          for(const path of assets){
            const response=await get(path);
            assert(response.status===200,'Public application asset: '+path);
            assert((await response.arrayBuffer()).byteLength>0,'Application asset must not be empty: '+path);
            console.log('ASSET 200 '+path);
          }
          const robots=await get('/robots.txt');
          assert(robots.status===200,'robots.txt HTTP 200');
          const robotsText=await robots.text();
          assert(robotsText.includes('Disallow: /admin'),'Administration must be excluded from crawling');
          assert(robotsText.includes('Sitemap: '+base+'/sitemap.xml'),'robots.txt must reference production sitemap');
          const sitemap=await get('/sitemap.xml');
          assert(sitemap.status===200,'sitemap.xml HTTP 200');
          assert((sitemap.headers.get('content-type')||'').includes('xml'),'Sitemap XML content type');
          const xml=await sitemap.text();
          const locs=[...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(x=>x[1]);
          assert(locs.includes(base),'Sitemap must include the homepage');
          assert(locs.includes(base+'/services/interior-painting-riyadh'),'Sitemap must include the interior painting service');
          assert(locs.every(x=>x===base||x.startsWith(base+'/')),'Sitemap URLs must use the production origin');
          assert(locs.every(x=>!x.includes('/admin')),'Sitemap must not expose administration');
          const missing=await get('/deployment-smoke-missing-page');
          assert(missing.status===404,'Unknown route must return HTTP 404');
          assert((await missing.text()).includes('يبدو أن الصفحة التي تبحث عنها غير موجودة'),'Helpful Arabic 404 page');
          for(const path of ['/admin','/admin/projects/new','/admin/settings']){
            const response=await get(path);
            assert([302,303].includes(response.status),'Anonymous administration route must redirect: '+path);
            assert(response.headers.get('location')==='/admin/login','Authentication redirect destination: '+path);
          }
          const login=await get('/admin/login');
          assert(login.status===200,'Public administrator login page HTTP 200');
          const loginHtml=await login.text();
          assert(/\bname=["']_csrf["']/.test(loginHtml),'Login form requires a CSRF token');
          assert(/noindex/.test(loginHtml),'Administrator login must be excluded from indexing');
          const cookies=login.headers.getSetCookie();
          assert(cookies.some(x=>/^lm\.sid=/.test(x)&&/;\s*HttpOnly/i.test(x)&&/;\s*Secure/i.test(x)&&/;\s*SameSite=Lax/i.test(x)),'Production authentication cookies require Secure, HttpOnly and SameSite');
          console.log('GET_SMOKE_PASSED: '+requests+' requests; '+pages.length+' public pages; review form and homepage CTA, SEO, assets, 404 and admin protection verified.');
          assert(reviewSession,'A public review session must be captured before malformed requests');
          let malformedRequests=0;
          for(const testCase of [{name:'empty body'},{name:'text/plain body',body:'not-a-review',contentType:'text/plain'}]){
            const headers={'X-CSRF-Token':reviewSession.csrf,'Origin':base,'Cookie':reviewSession.cookie};
            if(testCase.contentType)headers['Content-Type']=testCase.contentType;
            const response=await fetch(base+'/testimonials',{method:'POST',headers,body:testCase.body,redirect:'manual',signal:AbortSignal.timeout(20000)});
            malformedRequests++;
            assert(response.status===422,'Malformed review request must return HTTP 422: '+testCase.name);
            assert((response.headers.get('content-type')||'').includes('text/html'),'Malformed review response must be regular HTML: '+testCase.name);
            const html=await response.text();
            reviewForm(html);
            assert([...html.matchAll(/<div\b[^>]*>/gi)].some(x=>(attribute(x[0],'class')||'').split(/\s+/).includes('form-errors')&&attribute(x[0],'role')==='alert'),'Malformed review returns accessible form errors: '+testCase.name);
            for(const message of ['اكتب اسمًا من حرفين إلى 80 حرفًا.','اكتب رأيًا من 3 إلى 2000 حرف.','اختر تقييمًا صحيحًا من نجمة إلى خمس نجوم.','يلزم تأكيد موافقتك على نشر الاسم والرأي بعد المراجعة.'])assert(html.includes(message),'Malformed review must fail required-field validation: '+testCase.name);
            assert(!/class=["'][^"']*\bform-success\b/.test(html),'Malformed review must not show a success message: '+testCase.name);
            console.log('MALFORMED_REVIEW 422 '+testCase.name);
          }
          console.log('PRODUCTION_SMOKE_PASSED: '+requests+' GET requests; '+malformedRequests+' malformed review POST requests rejected; '+pages.length+' public pages; no valid review submitted, no administration POST, and no setup route visited.');
          NODE
